name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.2", "8.3", "8.4", "8.5" ]

    name: PHP ${{ matrix.php-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run checks
        run: composer check

  optional-packages:

    runs-on: ubuntu-latest

    name: Optional packages (${{ matrix.scenario }})

    strategy:
      fail-fast: false
      matrix:
        scenario:
          - all-present
          - no-console
          - no-behavior
          - no-generator
          - no-migrations
          - no-servicemanager
          - all-absent
        include:
          - scenario: all-present
            remove: ""
          - scenario: no-console
            remove: "symfony/console"
          - scenario: no-behavior
            remove: "cycle/entity-behavior"
          - scenario: no-generator
            remove: "cycle/schema-migrations-generator"
          - scenario: no-migrations
            remove: "cycle/migrations cycle/schema-migrations-generator"
          - scenario: no-servicemanager
            remove: "laminas/laminas-servicemanager"
          - scenario: all-absent
            remove: "cycle/entity-behavior cycle/migrations cycle/schema-migrations-generator symfony/console laminas/laminas-servicemanager"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Remove optional packages
        if: matrix.remove != ''
        run: composer remove --dev --no-update --no-plugins ${{ matrix.remove }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction --no-plugins

      - name: Run registration tests
        env:
          CYCLE_OPTIONAL_SCENARIO: ${{ matrix.scenario }}
        run: vendor/bin/phpunit --colors=always --fail-on-skipped test/OptionalPackageRegistrationTest.php

      - name: Run absent-package tests
        if: matrix.scenario == 'all-absent'
        run: vendor/bin/phpunit --colors=always --testdox --fail-on-skipped test/OptionalPackagesAbsentTest.php
